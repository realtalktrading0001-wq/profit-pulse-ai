<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
  <meta name="theme-color" content="#0a0a0a"/>
  <title>Profit Pulse AI</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{
      /* ── Professional Black + Gold ── */
      --bg:    #080808;
      --bg2:   #101010;
      --bg3:   #161616;
      --bg4:   #1e1e1e;

      /* Gold — primary accent (logo text colour) */
      --gold:  #d4a017;
      --gold2: #b8880f;
      --gold3: #f0c040;
      --gBg:   rgba(212,160,23,.1);
      --gBrd:  rgba(212,160,23,.28);
      --gGlow: rgba(212,160,23,.35);

      /* Signal colours — UP/DOWN badges AND candles ONLY */
      --up:    #22c55e;
      --upBg:  rgba(34,197,94,.12);
      --upGlw: rgba(34,197,94,.3);
      --dn:    #ef4444;
      --dnBg:  rgba(239,68,68,.12);
      --dnGlw: rgba(239,68,68,.3);

      /* Text */
      --tx:  #f0f0f0;
      --tx2: #888;
      --tx3: #444;

      /* Borders */
      --brd:  rgba(212,160,23,.14);
      --brdB: rgba(212,160,23,.3);
    }

    html,body{height:100%;width:100%;background:var(--bg);color:var(--tx);
      font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
      font-size:14px;overflow:hidden;-webkit-font-smoothing:antialiased;
      -webkit-tap-highlight-color:transparent}
    #app{height:100vh;display:flex;flex-direction:column;overflow:hidden}
    #main{flex:1;overflow:hidden;display:flex;flex-direction:column;min-height:0}

    /* ══════════════════════════════════════
       BOTTOM NAV
    ══════════════════════════════════════ */
    .bot-nav{display:flex;flex-shrink:0;background:#060606;
      border-top:1px solid var(--brdB);padding-bottom:env(safe-area-inset-bottom,0)}
    .nav-tab{flex:1;display:flex;flex-direction:column;align-items:center;
      justify-content:center;padding:8px 4px 10px;background:none;border:none;
      cursor:pointer;font-family:inherit;color:var(--tx3);transition:color .2s;gap:3px}
    .nav-tab.on{color:var(--gold)}
    .nav-tab .ni{font-size:19px}
    .nav-tab .nl{font-size:9px;font-weight:700;letter-spacing:.5px;text-transform:uppercase}

    /* ══════════════════════════════════════
       WELCOME SCREEN
    ══════════════════════════════════════ */
    .welcome-wrap{flex:1;position:relative;overflow:hidden;display:flex;
      flex-direction:column;align-items:center}

    /* Animated candlestick BG — only place where red/green appear outside signals */
    .candle-bg{position:absolute;bottom:0;left:0;right:0;height:55%;display:flex;
      align-items:flex-end;gap:5px;padding:0 6px;pointer-events:none;z-index:0;opacity:.2}
    .cb{border-radius:2px 2px 0 0;position:relative;flex:1}
    .cb.g{background:linear-gradient(180deg,var(--up),#16a34a)}
    .cb.r{background:linear-gradient(180deg,var(--dn),#b91c1c)}
    .cb::before{content:'';position:absolute;left:50%;transform:translateX(-50%);
      width:1.5px;top:-9px;height:10px;background:inherit}
    .cb::after{content:'';position:absolute;left:50%;transform:translateX(-50%);
      width:1.5px;bottom:-6px;height:7px;background:inherit}

    /* Subtle gold vignette overlay */
    .vignette{position:absolute;inset:0;z-index:1;pointer-events:none;
      background:radial-gradient(ellipse at 50% 30%,transparent 40%,rgba(8,8,8,.7) 100%)}

    /* Thin gold scanlines */
    .scanlines{position:absolute;inset:0;z-index:1;pointer-events:none;
      background:repeating-linear-gradient(0deg,transparent,transparent 3px,
        rgba(212,160,23,.018) 3px,rgba(212,160,23,.018) 4px)}

    .welcome-content{position:relative;z-index:2;display:flex;flex-direction:column;
      align-items:center;gap:14px;padding:26px 20px 24px;width:100%;overflow-y:auto}

    /* Logo */
    .logo-hero{width:120px;height:120px;border-radius:22px;overflow:hidden;flex-shrink:0;
      border:1.5px solid var(--gBrd);
      box-shadow:0 0 0 4px rgba(212,160,23,.06),0 8px 40px rgba(0,0,0,.8);
      animation:float 4s ease-in-out infinite}
    .logo-hero img{width:100%;height:100%;object-fit:cover;display:block}
    .logo-hero-fb{width:100%;height:100%;background:var(--bg3);display:flex;
      align-items:center;justify-content:center;font-size:48px}
    @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}

    .wc-title{font-size:24px;font-weight:900;letter-spacing:-.5px;text-align:center;
      color:var(--gold3);text-shadow:0 0 30px rgba(240,192,64,.25);animation:fadeUp .5s .1s ease both}
    .wc-sub-label{font-size:10px;font-weight:700;letter-spacing:3px;text-transform:uppercase;
      color:var(--tx2);animation:fadeUp .5s .15s ease both}
    .wc-desc{font-size:12px;color:var(--tx2);text-align:center;max-width:270px;line-height:1.65;
      animation:fadeUp .5s .2s ease both}

    .feat-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px;
      width:100%;max-width:320px;animation:fadeUp .5s .25s ease both}
    .feat-chip{background:var(--bg2);border:1px solid var(--brd);border-radius:10px;
      padding:9px 11px;display:flex;align-items:center;gap:8px;
      font-size:11px;font-weight:600;color:var(--tx2)}
    .feat-chip .fi{font-size:17px}

    /* Buttons */
    .btn-gold{width:100%;max-width:320px;border:none;border-radius:12px;padding:15px;
      font-size:14px;font-weight:800;color:#080808;cursor:pointer;font-family:inherit;
      -webkit-appearance:none;letter-spacing:.2px;
      background:linear-gradient(135deg,var(--gold3),var(--gold));
      box-shadow:0 4px 24px rgba(212,160,23,.3);animation:fadeUp .5s .35s ease both,
        glowGold 3s 1s infinite}
    .btn-gold:active{opacity:.82}
    @keyframes glowGold{0%,100%{box-shadow:0 4px 16px rgba(212,160,23,.25)}
      50%{box-shadow:0 4px 32px rgba(212,160,23,.55)}}

    .btn-outline-gold{width:100%;max-width:320px;border:1px solid var(--gBrd);
      border-radius:12px;padding:15px;font-size:14px;font-weight:700;color:var(--gold);
      cursor:pointer;font-family:inherit;background:transparent;-webkit-appearance:none;
      animation:fadeUp .5s .45s ease both;transition:background .2s}
    .btn-outline-gold:active{background:var(--gBg)}

    .btn-outline{width:100%;max-width:340px;border:1px solid var(--brd);border-radius:12px;
      padding:13px;font-size:13px;font-weight:600;color:var(--tx2);cursor:pointer;
      font-family:inherit;background:transparent;-webkit-appearance:none;transition:background .2s}
    .btn-outline:active{background:var(--bg3)}
    .btn-link{font-size:12px;color:var(--tx2);background:none;border:none;cursor:pointer;
      font-family:inherit;text-decoration:underline;text-underline-offset:3px}
    .divider{display:flex;align-items:center;gap:10px;width:100%;max-width:320px;
      animation:fadeUp .5s .4s ease both}
    .divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--brd)}
    .divider span{font-size:10px;color:var(--tx3)}

    /* Gate screen base */
    .screen{flex:1;overflow-y:auto;display:flex;flex-direction:column;
      align-items:center;padding:22px 18px 28px;gap:13px;animation:fadeUp .35s ease}
    .g-title{font-size:20px;font-weight:900;letter-spacing:-.4px;text-align:center;
      color:var(--gold3)}
    .g-sub{font-size:12px;color:var(--tx2);text-align:center;max-width:280px;line-height:1.65}
    .step-badge{background:var(--gBg);border:1px solid var(--gBrd);border-radius:20px;
      padding:3px 14px;font-size:10px;font-weight:700;color:var(--gold);letter-spacing:.5px}
    .info-box{background:var(--bg2);border:1px solid var(--brdB);border-radius:12px;
      padding:14px 15px;width:100%;max-width:340px}
    .ib-title{font-weight:700;font-size:12px;margin-bottom:8px;color:var(--gold)}
    .ib-item{font-size:11px;color:var(--tx2);padding:3px 0}
    .step-card{display:flex;gap:12px;align-items:flex-start;background:var(--bg2);
      border:1px solid var(--brd);border-radius:12px;padding:13px 14px;
      width:100%;max-width:340px}
    .step-n{width:28px;height:28px;border-radius:50%;flex-shrink:0;
      background:linear-gradient(135deg,var(--gold3),var(--gold));
      color:#080808;display:flex;align-items:center;justify-content:center;
      font-weight:900;font-size:12px}
    .step-title{font-weight:700;font-size:12px;margin-bottom:3px}
    .step-desc{font-size:11px;color:var(--tx2);line-height:1.55}
    .uid-input{width:100%;max-width:340px;background:#060606;border:1.5px solid var(--brdB);
      border-radius:12px;padding:14px 15px;font-size:16px;color:var(--tx);outline:none;
      font-family:inherit;transition:border-color .2s}
    .uid-input:focus{border-color:var(--gold);box-shadow:0 0 0 3px var(--gBg)}
    .uid-input.err{border-color:var(--dn)}
    .err-txt{font-size:11px;color:var(--dn);align-self:flex-start;max-width:340px;
      line-height:1.55;white-space:pre-line}
    .uid-hint{background:var(--gBg);border:1px solid var(--gBrd);border-radius:12px;
      padding:11px 13px;width:100%;max-width:340px}
    .uh-title{font-size:10px;font-weight:700;color:var(--gold);margin-bottom:4px}
    .uh-desc{font-size:10px;color:var(--tx2);line-height:1.5}

    /* ══════════════════════════════════════
       DASHBOARD HEADER
    ══════════════════════════════════════ */
    .dsh-hdr{background:linear-gradient(180deg,#060606 0%,#0d0d0d 100%);
      border-bottom:1px solid var(--brdB);padding:10px 14px;flex-shrink:0;
      box-shadow:0 4px 20px rgba(0,0,0,.8)}
    .hdr-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px}
    .logo-sm-wrap{display:flex;align-items:center;gap:9px}
    .logo-sm{width:32px;height:32px;border-radius:8px;overflow:hidden;flex-shrink:0;
      border:1px solid var(--gBrd)}
    .logo-sm img{width:100%;height:100%;object-fit:cover}
    .logo-sm-fb{width:100%;height:100%;background:var(--bg3);display:flex;
      align-items:center;justify-content:center;font-size:16px}
    .brand-name{font-size:14px;font-weight:900;letter-spacing:-.2px;color:var(--gold3)}
    .brand-sub{font-size:7px;color:var(--tx3);text-transform:uppercase;letter-spacing:1px;margin-top:1px}
    .hdr-right{display:flex;align-items:center;gap:6px}
    .badge-live{display:flex;align-items:center;gap:4px;background:rgba(34,197,94,.1);
      border:1px solid rgba(34,197,94,.3);border-radius:20px;padding:3px 9px;
      font-size:9px;font-weight:800;color:var(--up);letter-spacing:.8px}
    .live-dot{width:5px;height:5px;background:var(--up);border-radius:50%;animation:pulse 1.4s infinite}
    .badge-bal{display:flex;align-items:center;gap:4px;background:var(--gBg);
      border:1px solid var(--gBrd);border-radius:20px;padding:3px 9px;
      font-size:9px;font-weight:800;color:var(--gold)}

    /* Counter + timeframe row */
    .hdr-sub{display:flex;align-items:center;justify-content:space-between}
    .sig-counter{font-size:10px;color:var(--tx2)}
    .sig-counter strong{color:var(--gold);font-size:11px}
    .tf-btns{display:flex;gap:4px}
    .tf-btn{background:var(--bg3);border:1px solid var(--brd);border-radius:7px;
      padding:4px 11px;font-size:10px;font-weight:700;color:var(--tx3);
      cursor:pointer;font-family:inherit;transition:all .2s}
    .tf-btn.on{background:var(--gBg);border-color:var(--gBrd);color:var(--gold)}

    /* ══════════════════════════════════════
       SIGNAL CARD
    ══════════════════════════════════════ */
    .sig-wrap{flex:1;display:flex;flex-direction:column;padding:10px 14px;
      gap:9px;overflow:hidden;min-height:0}

    /* Animation classes applied via JS */
    .slide-in-r{animation:slideInR .25s ease forwards}
    .slide-in-l{animation:slideInL .25s ease forwards}
    .slide-out-l{animation:slideOutL .2s ease forwards}
    .slide-out-r{animation:slideOutR .2s ease forwards}
    @keyframes slideInR{from{opacity:0;transform:translateX(46px)}to{opacity:1;transform:translateX(0)}}
    @keyframes slideInL{from{opacity:0;transform:translateX(-46px)}to{opacity:1;transform:translateX(0)}}
    @keyframes slideOutL{from{opacity:1;transform:translateX(0)}to{opacity:0;transform:translateX(-46px)}}
    @keyframes slideOutR{from{opacity:1;transform:translateX(0)}to{opacity:0;transform:translateX(46px)}}
    @keyframes cardIn{0%{opacity:0;transform:scale(.97)}100%{opacity:1;transform:scale(1)}}

    .sig-hero{flex:1;display:flex;flex-direction:column;align-items:center;
      justify-content:center;border-radius:18px;border:1px solid var(--brd);
      padding:18px 16px;gap:14px;min-height:0;background:var(--bg2);
      position:relative;overflow:hidden;animation:cardIn .35s ease}

    /* Gold top glow line on hero card */
    .sig-hero::before{content:'';position:absolute;top:0;left:10%;right:10%;
      height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}

    /* UP: gold border + subtle green top-glow only */
    .sig-hero.up{border-color:rgba(212,160,23,.4);
      box-shadow:0 0 40px rgba(34,197,94,.06),0 0 0 1px rgba(212,160,23,.08)}
    /* DOWN: gold border + subtle red top-glow only */
    .sig-hero.dn{border-color:rgba(212,160,23,.4);
      box-shadow:0 0 40px rgba(239,68,68,.06),0 0 0 1px rgba(212,160,23,.08)}

    /* Pair section */
    .pair-section{display:flex;flex-direction:column;align-items:center;gap:4px}
    .pair-name-big{font-size:22px;font-weight:900;letter-spacing:-.3px;color:var(--tx)}
    .pair-line{width:40px;height:2px;background:linear-gradient(90deg,transparent,var(--gold),transparent);
      border-radius:1px}
    .pair-sub{font-size:10px;color:var(--tx2);letter-spacing:.3px}

    /* Direction badge — THE ONLY place with big red/green */
    .dir-badge{display:flex;flex-direction:column;align-items:center;gap:5px;
      padding:14px 36px;border-radius:16px;border:2px solid}
    .dir-badge.up{background:var(--upBg);border-color:var(--up);
      box-shadow:0 0 28px var(--upGlw);animation:upPulse 2.2s infinite}
    .dir-badge.dn{background:var(--dnBg);border-color:var(--dn);
      box-shadow:0 0 28px var(--dnGlw);animation:dnPulse 2.2s infinite}
    @keyframes upPulse{0%,100%{box-shadow:0 0 18px var(--upGlw)}
      50%{box-shadow:0 0 36px var(--upGlw),0 0 55px rgba(34,197,94,.15)}}
    @keyframes dnPulse{0%,100%{box-shadow:0 0 18px var(--dnGlw)}
      50%{box-shadow:0 0 36px var(--dnGlw),0 0 55px rgba(239,68,68,.15)}}
    .dir-arrow{font-size:40px;line-height:1;filter:drop-shadow(0 0 8px currentColor)}
    .dir-label{font-size:20px;font-weight:900;letter-spacing:4px}
    .dir-badge.up .dir-arrow,.dir-badge.up .dir-label{color:var(--up)}
    .dir-badge.dn .dir-arrow,.dir-badge.dn .dir-label{color:var(--dn)}

    /* Confidence — gold, not signal colour */
    .conf-section{display:flex;flex-direction:column;align-items:center;gap:5px;width:100%}
    .conf-num{font-size:40px;font-weight:900;letter-spacing:-2px;line-height:1;color:var(--gold3)}
    .conf-lbl{font-size:8px;font-weight:700;color:var(--tx3);text-transform:uppercase;letter-spacing:.8px}
    .conf-bar{width:100%;height:5px;background:var(--bg4);border-radius:3px;overflow:hidden}
    .conf-fill{height:100%;border-radius:3px;
      background:linear-gradient(90deg,var(--gold2),var(--gold3));
      box-shadow:0 0 8px rgba(212,160,23,.4);transition:width .55s ease}

    /* Trade info */
    .trade-row{display:flex;gap:7px;width:100%}
    .trade-cell{flex:1;background:var(--bg3);border:1px solid var(--brd);
      border-radius:10px;padding:8px 6px;display:flex;flex-direction:column;
      align-items:center;gap:3px}
    .tc-lbl{font-size:7.5px;color:var(--tx3);text-transform:uppercase;letter-spacing:.5px;font-weight:600}
    .tc-val{font-size:13px;font-weight:800;color:var(--tx);font-variant-numeric:tabular-nums}

    /* Nav buttons */
    .sig-nav{display:flex;gap:8px;padding:0 14px;flex-shrink:0}
    .btn-nav{flex:1;border-radius:12px;padding:13px;font-size:13px;font-weight:700;
      cursor:pointer;font-family:inherit;display:flex;align-items:center;
      justify-content:center;gap:7px;-webkit-appearance:none;transition:all .2s;border:1px solid}
    .btn-nav.prev{background:var(--bg3);border-color:var(--brd);color:var(--tx2)}
    .btn-nav.prev:active{background:var(--bg4)}
    .btn-nav.next{background:linear-gradient(135deg,rgba(212,160,23,.18),rgba(212,160,23,.06));
      border-color:var(--gBrd);color:var(--gold);
      box-shadow:0 0 18px rgba(212,160,23,.15);animation:glowBtn 2.8s infinite}
    @keyframes glowBtn{0%,100%{box-shadow:0 0 10px rgba(212,160,23,.1)}
      50%{box-shadow:0 0 24px rgba(212,160,23,.35)}}
    .btn-nav.next:active{opacity:.8}

    .disclaimer{padding:5px 14px 6px;font-size:8px;color:var(--tx3);text-align:center;
      border-top:1px solid var(--brd);line-height:1.5;flex-shrink:0}

    /* ══════════════════════════════════════
       ACCOUNT & HELP TABS
    ══════════════════════════════════════ */
    .tab-scroll{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px}

    /* Balance card */
    .bal-card{background:linear-gradient(135deg,#141008,#0f0f0f);
      border:1px solid var(--gBrd);border-radius:16px;padding:20px 16px;
      display:flex;flex-direction:column;align-items:center;gap:5px;position:relative;overflow:hidden}
    .bal-card::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;
      background:linear-gradient(90deg,transparent,var(--gold),transparent)}
    .bal-amount{font-size:36px;font-weight:900;letter-spacing:-1.5px;color:var(--gold3);
      text-shadow:0 0 20px rgba(240,192,64,.2)}
    .bal-lbl{font-size:9px;text-transform:uppercase;letter-spacing:1px;color:var(--tx2)}
    .bal-note{font-size:9px;color:var(--tx3);margin-top:2px}

    .panel-card{background:var(--bg2);border:1px solid var(--brd);border-radius:12px;padding:14px}
    .panel-label{font-size:8.5px;color:var(--tx3);text-transform:uppercase;letter-spacing:.6px;margin-bottom:6px}
    .status-chip{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;
      border-radius:20px;font-size:11px;font-weight:700}
    .uid-mono{font-family:monospace;font-size:16px;font-weight:800;color:var(--gold);margin-top:3px}

    .stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
    .stat-box{text-align:center;background:var(--bg3);border:1px solid var(--brd);
      border-radius:10px;padding:11px 8px}
    .stat-val{font-size:17px;font-weight:900}
    .stat-lbl{font-size:8px;color:var(--tx3);text-transform:uppercase;letter-spacing:.4px;margin-top:3px}

    /* Help / Support */
    .support-card{background:linear-gradient(135deg,#120f04,#0f0f0f);
      border:1px solid var(--gBrd);border-radius:14px;padding:14px;
      display:flex;align-items:center;gap:12px;text-decoration:none;color:inherit;
      transition:background .2s;position:relative;overflow:hidden}
    .support-card::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;
      background:linear-gradient(90deg,transparent,var(--gold),transparent)}
    .support-card:active{background:var(--bg3)}
    .sc-ico{width:42px;height:42px;border-radius:50%;
      background:linear-gradient(135deg,var(--gold3),var(--gold));
      display:flex;align-items:center;justify-content:center;font-size:19px;
      flex-shrink:0;color:#080808}
    .sc-name{font-weight:800;font-size:13px;color:var(--gold3)}
    .sc-sub{font-size:10px;color:var(--tx2);margin-top:2px}
    .faq-item{background:var(--bg2);border:1px solid var(--brd);border-radius:12px;padding:13px}
    .faq-q{font-weight:700;font-size:12px;margin-bottom:5px;color:var(--gold)}
    .faq-a{font-size:11px;color:var(--tx2);line-height:1.6}

    /* Free preview */
    .free-scroll{flex:1;overflow-y:auto;padding:12px 14px 20px;display:flex;flex-direction:column;gap:10px}
    .free-badge{background:linear-gradient(135deg,var(--gold3),var(--gold));
      border-radius:20px;padding:3px 12px;font-size:11px;font-weight:800;color:#080808}
    .locked-stack{position:relative;border-radius:12px;overflow:hidden}
    .locked-inner{filter:blur(3px);opacity:.45;pointer-events:none;display:flex;flex-direction:column;gap:5px}
    .locked-overlay{position:absolute;inset:0;background:rgba(8,8,8,.9);
      display:flex;flex-direction:column;align-items:center;justify-content:center;
      gap:10px;padding:18px;text-align:center}
    .sig-mini{background:var(--bg2);border:1px solid var(--brd);border-radius:10px;
      padding:10px 12px;display:flex;align-items:center;gap:9px}

    /* Animations */
    @keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}

const TFS = [

  {label:'1m',  ms:60000},
  {label:'2m',  ms:120000},

]

// ═══════════════════════════════════════════
//  SIGNAL ENGINE
// ═══════════════════════════════════════════
function sRand(s){let r=s>>>0;r=(r^r<<13)>>>0;r=(r^r>>>17)>>>0;r=(r^r<<5)>>>0;return r/0xFFFFFFFF}
function hash(str){let h=0;for(let i=0;i<str.length;i++)h=(h<<5)-h+str.charCodeAt(i)|0;return Math.abs(h)}
function fmtT(d){return d.toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false})}

function makeSignal(pair, tfObj){
  const now=new Date()
  const key=Math.floor(now.getTime()/tfObj.ms)
  const seed=hash(pair.id+'_'+key)
  const rsi=20+sRand(seed)*60,macd=sRand(seed+1)>.5?1:-1,bb=sRand(seed+2),st=sRand(seed+3)*100
  let up=0,dn=0
  rsi<30?(up+=2):rsi>70?(dn+=2):rsi<45?up++:rsi>55?dn++:0
  macd>0?up++:dn++;bb<.3?(up+=2):bb>.7?(dn+=2):0;st<20?up++:st>80?dn++:0
  const dir=up>=dn?'UP':'DOWN',rawC=Math.max(up,dn)/(up+dn)*100
  const conf=Math.round(Math.min(95,Math.max(72,72+(rawC-50)/50*23)))
  // secsLeft = ms remaining in current period
  const sl=Math.max(1,Math.ceil((tfObj.ms-(now.getTime()%tfObj.ms))/1000))
  const eD=new Date(now.getTime()+sl*1000)
  return{id:pair.id+'-'+tfObj.label+'-'+key,pair,dir,conf,
    tfLabel:tfObj.label,tfMs:tfObj.ms,
    secsLeft:sl,entry:fmtT(eD),expiry:fmtT(new Date(eD.getTime()+tfObj.ms))}
}
function genSignals(tfObj){
  return PAIRS.map(p=>makeSignal(p,tfObj)).sort((a,b)=>b.conf-a.conf)
}

    if(el){

      el.style.color=S.secsLeft<=10?'var(--dn)':S.secsLeft<=30?'var(--gold)':'var(--tx)'

    }

    if(fill && S.totalSecs>0){

      fill.style.width=pct+'%'
      const col=pct>40?'var(--up)':'var(--dn)'
      fill.style.background=col

function renderCard(dir){

const MAIN=document.getElementById('main')

function render(){
  stopAll()
  let html=''
  if(S.tab==='account') html=tabAccount()
  else if(S.tab==='help') html=tabHelp()
  else{
    if(S.verified) html=tabSignals()
    else{ const f={welcome:screenWelcome,free:screenFree,howto:screenHowTo,verify:screenVerify,pending:screenPending};html=(f[S.gate]||screenWelcome)() }
  }
  MAIN.innerHTML=html;renderNav();bindAll()
  if(S.verified&&S.tab==='signals') startCD()
}

// ═══════════════════════════════════════════
//  NAVIGATION
// ═══════════════════════════════════════════
// Check if user already used free signal (localStorage + API)
async function checkFreeAndShow(){
  // Check localStorage first (instant)
  try{ if(localStorage.getItem('ppai_free_used')==='1'){ S.freeUsed=true;S.freeExpired=false;S.gate='free';render();return } }catch{}
  // Check API (if inside Telegram)
  if(tg?.initData){
    try{
      const r=await fetch('/api/free/check',{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({initData:tg.initData})})
      const d=await r.json()
      if(d.used){ S.freeUsed=true;S.freeExpired=false;S.gate='free';render();return }
    }catch{}
  }
  // Not used — show free signal
  S.freeUsed=false;S.freeExpired=false;S.gate='free';render()
}

function setTab(t){S.tab=t;render()}
function goGate(g){S.tab='signals';S.gate=g;render()}
function freshStart(){
  // Give the signal a full-period countdown from NOW
  const fullSecs=Math.ceil(S.tf.ms/1000)
  S.secsLeft=fullSecs
  S.totalSecs=fullSecs
  // Update entry/expiry to start from right now
  const now=new Date()
  const eD=new Date(now.getTime()+S.tf.ms)
  const sig=S.signals[S.signalIdx]
  if(sig){ sig.entry=fmtT(now); sig.expiry=fmtT(eD); sig.secsLeft=fullSecs }
}
function goNext(){S.signalIdx=(S.signalIdx+1)%S.signals.length;freshStart();renderCard('next');startCD()}
function goPrev(){S.signalIdx=(S.signalIdx+S.signals.length-1)%S.signals.length;freshStart();renderCard('prev');startCD()}

// ═══════════════════════════════════════════
//  EVENT BINDING
// ═══════════════════════════════════════════
function bindAll(){
  const q=(id,fn)=>{const el=document.getElementById(id);if(el)el.onclick=fn}
  q('btn-free',()=>checkFreeAndShow())
  q('btn-bk-free',()=>{S.freeUsed=false;S.freeExpired=false;goGate('welcome')})
  q('btn-reg',()=>{window.open(AFFILIATE,'_blank');goGate('howto')})
  q('btn-skip',()=>goGate('verify'))
  q('btn-free-reg',()=>{window.open(AFFILIATE,'_blank');goGate('howto')})
  q('btn-already-free',()=>goGate('verify'))
  q('btn-aff',()=>window.open(AFFILIATE,'_blank'))
  q('btn-cont',()=>goGate('verify'))
  q('btn-bk',()=>goGate('welcome'))
  const inp=document.getElementById('uid-in')
  if(inp) inp.addEventListener('input',e=>{S.uid=e.target.value;S.err=''})
  q('btn-verify',doVerify)
  q('btn-bk-h',()=>goGate('howto'))
  q('btn-back-pending',()=>{S.gate='verify';S.err='';render()})
  q('btn-acct-reg',()=>{window.open(AFFILIATE,'_blank');goGate('howto')})
  q('btn-acct-uid',()=>goGate('verify'))
  q('btn-next',goNext)
  q('btn-prev',goPrev)
  document.querySelectorAll('.tf-btn').forEach(b=>{
    b.onclick=()=>{
      S.tf=TFS.find(t=>t.label===b.dataset.tflabel)||TF_DEFAULT
      S.signals=genSignals(S.tf);S.signalIdx=0
      S.secsLeft=S.signals[0].secsLeft;S.totalSecs=S.secsLeft
      render()
    }
  })
}

// ═══════════════════════════════════════════
//  VERIFY
// ═══════════════════════════════════════════
async function doVerify(){
  const uid=S.uid.trim()
  if(!uid||uid.length<4){S.err='Please enter a valid UID (minimum 4 digits)';render();return}
  S.loading=true;render()
  try{
    const res=await fetch('/api/auth/verify',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({pocketOptionUid:uid,initData:tg?.initData||''})})
    const data=await res.json()
    S.loading=false
    if(data.success){S.verified=true;S.tab='signals';S.uid=data.uid||uid;S.balance=data.balance??null;
      S.signals=genSignals(S.tf);S.signalIdx=0;S.secsLeft=S.signals[0].secsLeft;persist();render()}
    else if(data.pending){S.gate='pending';render()}
    else{S.err=data.error||'Verification failed. Try again.';render()}
  }catch{S.loading=false;S.verified=true;S.tab='signals';S.signals=genSignals(S.tf);
    S.signalIdx=0;S.secsLeft=S.signals[0].secsLeft;render()}
}

// ═══════════════════════════════════════════
//  STARTUP
// ═══════════════════════════════════════════
async function init(){
  try{
    if(tg?.initData){
      const res=await fetch('/api/auth/check',{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({initData:tg.initData})})
      const data=await res.json()
      if(data.hasAccess){S.verified=true;if(data.balance!=null)S.balance=data.balance;if(data.uid)S.uid=data.uid;persist()}
      else if(data.pending) S.gate='pending'
      else if(data.reason==='balance_too_low'){S.err=`⚠️ Your balance ($${data.balance?.toFixed(2)}) dropped below the $${data.minBalance} minimum.\n\nDeposit to restore access and re-enter your UID.`;S.gate='verify'}
    }
  }catch{}
  S.signals=genSignals(S.tf);S.signalIdx=0;S.secsLeft=S.signals[0].secsLeft;S.totalSecs=S.secsLeft;render()
}
init()
</script>
